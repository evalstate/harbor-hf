name: Publish trial worker

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/huggingface/harbor-hf-trial-worker

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4.3.0
      - id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: deploy/trial-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          provenance: false
      - run: echo "Published $IMAGE_NAME@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
