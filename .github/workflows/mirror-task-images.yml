name: Mirror task images

on:
  workflow_dispatch:
    inputs:
      images_json:
        description: Digest-pinned OCI source images as a JSON array
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/huggingface/harbor-hf-trial-worker

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        source_image: ${{ fromJSON(inputs.images_json) }}
    steps:
      - name: Install image copier
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - name: Log in to the destination registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          skopeo login ghcr.io \
            --username "$REGISTRY_USER" \
            --password-stdin <<<"$REGISTRY_TOKEN"
      - name: Mirror the immutable image
        env:
          SOURCE_IMAGE: ${{ matrix.source_image }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_IMAGE" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "Source image must be digest-pinned" >&2
            exit 1
          fi

          name="${SOURCE_IMAGE%@*}"
          digest="${SOURCE_IMAGE##*@}"
          last_component="${name##*/}"
          if [[ "$last_component" == *:* ]]; then
            name="${name%:*}"
          fi
          first_component="${name%%/*}"
          if [[ "$name" != */* ]]; then
            name="docker.io/library/$name"
          elif [[ "$first_component" != *.* && "$first_component" != *:* && "$first_component" != "localhost" ]]; then
            name="docker.io/$name"
          fi

          tag="task-${digest#sha256:}"
          skopeo copy \
            --all \
            --preserve-digests \
            "docker://$name@$digest" \
            "docker://$IMAGE_NAME:$tag"

          actual_digest="$(
            skopeo inspect --raw "docker://$IMAGE_NAME:$tag" |
              sha256sum |
              cut -d " " -f 1
          )"
          if [[ "sha256:$actual_digest" != "$digest" ]]; then
            echo "Mirrored image digest does not match its source" >&2
            exit 1
          fi
